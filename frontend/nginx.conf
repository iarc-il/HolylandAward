server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Proxy API requests to backend container (internal Docker networking)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow larger file uploads (20MB for ADIF log files)
        client_max_body_size 20M;
    }

    # Handle React Router (SPA).
    # The page itself (index.html) must never be served from the browser's
    # cache without asking the server: it names the current build's script
    # files, so a stale copy keeps users on the old version until they press
    # Shift+F5. "no-cache" = always check (cheap 304 if unchanged). The built
    # files under /assets have the version in their name, so those can stay
    # cached for a year (see below).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        # add_header in a location replaces the server-level ones, so repeat
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
